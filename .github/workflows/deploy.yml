name: Build and Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [microcms-update]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # FTP情報が未登録のうちはデプロイステップを自動スキップするための判定用
      FTP_CONFIGURED: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx eleventy
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}

      - name: Deploy via FTPS
        # FTP情報が未登録のうちはこのステップを自動スキップ（ビルド確認だけ行う）
        if: ${{ env.FTP_CONFIGURED != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: _site/
          server-dir: /home/sakurai-crc/www/sakurai-crc.org/
          # 安全のため削除同期はしない（追加・上書きのみ）。
          # サーバー上の遺物(bk/等)を壊さないための設定。安定運用後に見直し可。
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

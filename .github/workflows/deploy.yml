name: Build and Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [microcms-update]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # FTP情報が未登録のうちはデプロイステップを自動スキップするための判定用
      FTP_CONFIGURED: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx eleventy
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}

      - name: Deploy via FTP
        # FTP情報が未登録のうちはこのステップを自動スキップ（ビルド確認だけ行う）
        # さくらのFTP仕様(複数階層CWD不可)対応のため専用スクリプトでアップロードする
        if: ${{ env.FTP_CONFIGURED != '' }}
        run: node scripts/deploy-ftp.mjs
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
